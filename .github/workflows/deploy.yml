name: Deploy
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # main -> production (live), staging branch -> staging
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Pre-launch: every build targets /sc-test/ (noindex), matching the test@ FTP account.
      # At go-live, set BASE_PATH to '/sc' and PUBLIC_ENV to 'production' for main.
      - run: npm run build
        env:
          BASE_PATH: /sc-test
          PUBLIC_ENV: staging
      - name: Check internal links
        run: npm run check:links
        env:
          BASE_PATH: /sc-test
      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        # FTP_SERVER and FTP_USERNAME are environment variables; only the password is a secret.
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /
          # security: loose   # only if the TLS certificate hostname cannot be matched
